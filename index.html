<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decko</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#fff}
.top{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;box-shadow:0 2px 5px #0001;position:sticky;top:0;z-index:10}
.logo{font-size:30px;font-weight:900;color:#FFB500}
.logo i{color:#000;font-style:normal}
.search{margin:14px;background:#F2F2F2;border-radius:28px;display:flex;align-items:center;padding:0 6px 0 16px}
.search input{flex:1;border:none;background:transparent;padding:14px 0;font-size:15px;outline:none}
.search button{background:#FFB500;border:none;width:42px;height:42px;border-radius:50%;font-size:20px;font-weight:bold}
.cats{display:flex;gap:8px;padding:0 16px;overflow:auto;white-space:nowrap}
.cat{background:#F0F0F0;padding:8px 14px;border-radius:20px;font-size:13px}
.cat.active{background:#000;color:#FFB500}
.list{padding:16px;padding-bottom:80px}
.card{display:flex;gap:10px;margin-bottom:14px;box-shadow:0 2px 10px #0001;border-radius:12px;overflow:hidden}
.card img{width:150px;height:90px;object-fit:cover}
.card .t{padding:8px;flex:1}
.card .t h4{font-size:14px;line-height:18px;height:36px;overflow:hidden}
.card .t p{font-size:11px;color:#888;margin:4px 0}
.btn{background:#FFB500;border:none;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;font-size:11px;text-align:center}
.nav b{display:block;font-size:18px}
</style>
</head>
<body>
<div class="top"><div class="logo">Decko<i>.</i></div><div>🔔 ⋮</div></div>
<div class="search"><input id="q" placeholder="Search videos or paste link..."><button onclick="search()">⌕</button></div>
<div class="cats"><div class="cat active">▶ YouTube</div><div class="cat">f Facebook</div><div class="cat">📸 Instagram</div><div class="cat">♪ TikTok</div><div class="cat">🟢 WhatsApp Status</div><div class="cat">🔒 Vault</div></div>
<div class="list" id="list">
<div style="text-align:center;padding:60px 20px;color:#999">
<div style="font-size:50px">⬇</div>
<h2 style="color:#FFB500;margin:10px 0">Decko</h2>
<p>Snaptube Clone - All Video Downloader</p>
<p style="margin-top:20px;font-size:12px">উপরে Search করো, ভিডিও আসবে, Download এ ক্লিক করলেই Download হবে</p>
</div>
</div>
<div class="nav"><div><b>⌂</b>Home</div><div><b>⬇</b>My Files</div><div><b>◧</b>Vault</div><div><b>⚙</b>Me</div></div>
<script>
async function search(){
let k=document.getElementById('q').value; if(!k) return;
document.getElementById('list').innerHTML='<p style="text-align:center;padding:30px">Searching in Decko...</p>';
try{
let r=await fetch('https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(k));
let d=await r.json();
let h='';
d.items.slice(0,20).forEach(v=>{
h+=`<div class="card"><img src="${v.thumbnail}"><div class="t"><h4>${v.title}</h4><p>${v.uploaderName} • ${v.views} views</p><button class="btn" onclick="dl('https://youtube.com${v.url}')">Download</button></div></div>`;
});
document.getElementById('list').innerHTML=h;
}catch(e){document.getElementById('list').innerHTML='<p style="text-align:center;padding:30px">Link paste করো, Error!</p>'}
}
function dl(url){ window.open('https://api.cobalt.tools/api/json','_blank'); alert('Decko Download: '+url+'\nServer ready, 720p/MP3 সিলেক্ট করো'); }
</script>
</body>
</html>
